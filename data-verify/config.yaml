# 数据校验配置文件
# 修改此文件以调整校验行为，无需修改代码

# ============================================================
# 全局配置
# ============================================================
global:
  # 数据文件目录（支持绝对路径或相对路径）
  data_directory: "../crawler/data"

  # 日志目录
  log_dir: "./logs"
  # 单日志文件最大大小（MB），超出后立即滚动
  log_max_size_mb: 5

  # 校验日期范围
  date_range:
    start: "2025-01-01"
    end: "2025-01-07"

  # 定时任务日期对齐
  # 启用后，会读取 crawler/config.yaml 中的 schedule 与 tasks 配置，
  # 将这里的 date_range 视为“任务触发日期范围”，再按各任务的 schedule_date_offset_days
  # 换算为实际应存在的数据文件日期，保证校验侧与爬取侧使用同一套日期规则。
  schedule_alignment:
    enabled: true
    crawler_config: "../crawler/config.yaml"

  # 输出报告目录（默认为脚本所在目录）
  output_directory: null  # null 表示使用脚本所在目录

  # 报告文件名
  report_files:
    missing: "loss.txt"
    errors: "validation_errors.txt"

  # 性能参数
  performance:
    max_rows_to_scan: 10       # 读取Excel时最大行数
    scan_rows_for_content: 10   # 扫描内容时最大行数
    max_header_attempts: 4      # 尝试的header行数（0到N-1）
    max_cols_to_scan: 20        # 扫描列数上限

# ============================================================
# 校验对象配置
# 每个校验对象定义一类文件的校验规则
# ============================================================
validators:

  # ----------------------------------------------------------
  # 日前联络线计划 - 专项校验（含通道完整性，动态通道模式）
  # ----------------------------------------------------------
  - name: "日前联络线计划"
    enabled: true

    # 文件匹配规则
    file_pattern:
      prefix: "日前联络线计划_"
      extensions: [".xlsx"]
      # 文件名格式: {prefix}{date}_{channel}{ext}
      # 例如: 日前联络线计划_2025-01-01_山西送河北(省间现货).xlsx
      name_format: "prefix_date_channel"

    # 校验项目
    checks:
      # 文件完整性：从元数据文件动态获取每日期的通道列表
      completeness:
        enabled: true
        dynamic_channels: true
        channels_meta_file: "../crawler/data/exports/_channels_meta.json"

      # 文件名日期与表格内日期一致性
      date_consistency:
        enabled: true
        # 表格中日期列的表头关键词
        date_header_keywords: ["日期", "时间"]
        # 支持的日期格式
        date_formats: ["%Y-%m-%d", "%Y/%m/%d"]

      # 文件名通道与表格内通道一致性
      channel_consistency:
        enabled: true
        dynamic_channels: true
        channels_meta_file: "../crawler/data/exports/_channels_meta.json"
        # 表格中通道列的表头关键词
        channel_header_keywords: ["通道"]

    # 报告过滤规则（哪些错误类型不输出到报告）
    report_filters:
      skip_error_types:
        date: ["no_date_data"]          # 跳过"有日期表头但无数据"的日期错误
        channel: []                      # 通道错误不跳过任何类型
      # 通道错误中，若表格内通道名称为空则跳过
      skip_empty_channel_mismatch: true

  # ----------------------------------------------------------
  # 机组实际发电曲线 - 仅日期一致性校验
  # ----------------------------------------------------------
  - name: "机组实际发电曲线"
    enabled: true

