  # 二次调频机组收益信息 - 完整性 + 日期一致性校验
  # ----------------------------------------------------------
  - name: "二次调频机组收益信息"
    enabled: true

    file_pattern:
      prefix: "二次调频机组收益信息_"
      extensions: [".xlsx"]
      name_format: "prefix_date"

    checks:
      completeness:
        enabled: true
        expected_count: 1
      date_consistency:
        enabled: true
        date_header_keywords: ["日期", "时间"]
        date_formats: ["%Y-%m-%d", "%Y/%m/%d"]
      channel_consistency:
        enabled: false

