# 数据校验配置文件
# 修改此文件以调整校验行为，无需修改代码

# ============================================================
# 全局配置
# ============================================================
global:
  # 数据文件目录（支持绝对路径或相对路径）
  data_directory: "/Users/x/Documents/workspace/汉燧智能/auto-crawler/crawler/data"

  # 校验日期范围
  date_range:
    start: "2023-01-01"
    end: "2023-01-05"

  # 输出报告目录（默认为脚本所在目录）
  output_directory: null  # null 表示使用脚本所在目录

  # 报告文件名
  report_files:
    missing: "loss.txt"
    errors: "validation_errors.txt"

  # 性能参数
  performance:
    max_rows_to_scan: 50       # 读取Excel时最大行数
    scan_rows_for_content: 50   # 扫描内容时最大行数
    max_header_attempts: 4      # 尝试的header行数（0到N-1）
    max_cols_to_scan: 20        # 扫描列数上限

# ============================================================
# 校验对象配置
# 每个校验对象定义一类文件的校验规则
# ============================================================
validators:

  # ----------------------------------------------------------
  # 日前联络线计划 - 专项校验（含通道完整性）
  # ----------------------------------------------------------
  - name: "日前联络线计划"
    enabled: true

    # 文件匹配规则
    file_pattern:
      prefix: "日前联络线计划_"
      extensions: [".xlsx"]
      # 文件名格式: {prefix}{date}_{channel}{ext}
      # 例如: 日前联络线计划_2025-01-01_山西送河北(省间现货).xlsx
      name_format: "prefix_date_channel"

    # 校验项目
    checks:
      # 文件完整性：每个日期必须有指定数量的文件（每通道一个）
      completeness:
        enabled: true
        expected_count: 22  # 每个日期期望的文件数量

      # 文件名日期与表格内日期一致性
      date_consistency:
        enabled: true
        # 表格中日期列的表头关键词
        date_header_keywords: ["日期", "时间"]
        # 支持的日期格式
        date_formats: ["%Y-%m-%d", "%Y/%m/%d"]

      # 文件名通道与表格内通道一致性
      channel_consistency:
        enabled: true
        # 表格中通道列的表头关键词
        channel_header_keywords: ["通道"]

    # 标准通道列表（完整性校验和通道一致性校验均使用此列表）
    standard_channels:
      - "过境送雁淮(省间现货)"
      - "过境送雁淮(月计划)"
      - "过境送长南(省间现货)"
      - "过境送长南(月计划)"
      - "河北负荷"
      - "华北负荷"
      - "京津唐"
      - "山西送河北(华北跨省)"
      - "山西送河北(省间现货)"
      - "山西送河北(月计划)"
      - "山西送京津唐(华北跨省)"
      - "山西送京津唐(省间现货)"
      - "山西送京津唐(月计划)"
      - "山西送锡泰(省间现货)"
      - "山西送锡泰(月计划)"
      - "山西送雁淮(省间现货)"
      - "山西送雁淮(月计划)"
      - "山西送长南(省间现货)"
      - "山西送长南(月计划)"
      - "特高压雁淮直流外送"
      - "特高压长南线"
      - "总加"

    # 报告过滤规则（哪些错误类型不输出到报告）
    report_filters:
      skip_error_types:
        date: ["no_date_data"]          # 跳过"有日期表头但无数据"的日期错误
        channel: []                      # 通道错误不跳过任何类型
      # 通道错误中，若表格内通道名称为空则跳过
      skip_empty_channel_mismatch: true

  # ----------------------------------------------------------
  # 实时各时段出清现货电量 - 仅日期一致性校验
  # ----------------------------------------------------------
  - name: "实时各时段出清现货电量"
    enabled: false  # 设为 true 以启用此校验

    file_pattern:
      prefix: "实时各时段出清现货电量_"
      extensions: [".xlsx", ".csv"]
      name_format: "prefix_date"

    checks:
      completeness:
        enabled: false
        expected_count: 1
      date_consistency:
        enabled: true
        date_header_keywords: ["日期", "时间"]
        date_formats: ["%Y-%m-%d", "%Y/%m/%d"]
      channel_consistency:
        enabled: false

  # ----------------------------------------------------------
  # 实时输电断面约束及阻塞 - 仅日期一致性校验
  # ----------------------------------------------------------
  - name: "实时输电断面约束及阻塞"
    enabled: false

    file_pattern:
      prefix: "实时输电断面约束及阻塞_"
      extensions: [".xlsx"]
      name_format: "prefix_date"

    checks:
      completeness:
        enabled: false
        expected_count: 1
      date_consistency:
        enabled: true
        date_header_keywords: ["日期", "时间"]
        date_formats: ["%Y-%m-%d", "%Y/%m/%d"]
      channel_consistency:
        enabled: false

  # ----------------------------------------------------------
  # 日前机组开机安排 - 仅日期一致性校验
  # ----------------------------------------------------------
  - name: "日前机组开机安排"
    enabled: false

    file_pattern:
      prefix: "日前机组开机安排_"
      extensions: [".xlsx"]
      name_format: "prefix_date"

    checks:
      completeness:
        enabled: false
        expected_count: 1
      date_consistency:
        enabled: true
        date_header_keywords: ["日期", "时间"]
        date_formats: ["%Y-%m-%d", "%Y/%m/%d"]
      channel_consistency:
        enabled: false

  # ----------------------------------------------------------
  # 机组实际发电曲线 - 仅日期一致性校验
  # ----------------------------------------------------------
  - name: "机组实际发电曲线"
    enabled: true

    file_pattern:
      prefix: "机组实际发电曲线_"
      extensions: [".xlsx"]
      name_format: "prefix_date"

    checks:
      completeness:
        enabled: true
        expected_count: 1
      date_consistency:
        enabled: true
        date_header_keywords: ["日期", "时间"]
        date_formats: ["%Y-%m-%d", "%Y/%m/%d"]
      channel_consistency:
        enabled: false

