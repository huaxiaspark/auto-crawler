services:

  # ── 采集服务基础镜像（仅用于构建，不运行）──────────────────────────────
  crawler-service-base:
    build:
      context: ./crawler-service/base
      dockerfile: Dockerfile
    image: crawler-service-base:latest
    profiles: ["build-only"]

  # ── 处理服务基础镜像（仅用于构建，不运行）──────────────────────────────
  crawler-processor-service-base:
    build:
      context: ./processor-service/base
      dockerfile: Dockerfile
    image: crawler-processor-service-base:latest
    profiles: ["build-only"]

  # ── MinIO 对象存储 ────────────────────────────────────────────────────
  crawler-minio-service:
    container_name: ${CRAWLER_CONTAINER_PREFIX:-auto-crawler}-minio
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    restart: always
    ports:
      - "29000:9000"
      - "29001:9001"
    environment:
      - MINIO_ROOT_USER=${CRAWLER_MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${CRAWLER_MINIO_SECRET_KEY}
    volumes:
      - ./data/minio:/data:rw
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - crawler-net

  # ── 采集服务（服务器 A）────────────────────────────────────────────────
  crawler-service:
    container_name: ${CRAWLER_CONTAINER_PREFIX:-auto-crawler}-crawler
    build:
      context: ./crawler-service
      dockerfile: Dockerfile
    pull_policy: never
    image: crawler-service:latest
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "28300:8300"
    environment:
      - CRAWLER_MINIO_ACCESS_KEY=${CRAWLER_MINIO_ACCESS_KEY}
      - CRAWLER_MINIO_SECRET_KEY=${CRAWLER_MINIO_SECRET_KEY}
      - CRAWLER_NOTIFY_SECRET=${CRAWLER_NOTIFY_SECRET}
    volumes:
      - ./crawler:/app/crawler:rw
      - ./common:/app/common:ro
      - ./data-verify:/app/data-verify:rw
      - ./crawler-service/config.yaml:/app/crawler-service/config.yaml:ro
      - ./data/crawler:/app/crawler/data:rw
      - ./data/data-verify/loss.txt:/app/data-verify/loss.txt:rw
      - ./data/data-verify/validation_errors.txt:/app/data-verify/validation_errors.txt:rw
      - ./logs/crawler-service:/app/crawler-service/logs:rw
    networks:
      - crawler-net

  # ── Cookie 保活服务（与采集服务部署在同一台机器）───────────────────────
  keepalive-service:
    container_name: ${CRAWLER_CONTAINER_PREFIX:-auto-crawler}-keepalive
    build:
      context: ./keepalive-service
      dockerfile: Dockerfile
    pull_policy: never
    image: keepalive-service:latest
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./crawler:/app/crawler:ro
      - ./common:/app/common:ro
      - ./keepalive-service/config.yaml:/app/keepalive-service/config.yaml:ro
      - ./logs/crawler-service:/app/crawler-service/logs:rw
      - ./logs/keepalive-service:/app/keepalive-service/logs:rw
    networks:
      - crawler-net

  # ── 处理服务（服务器 B）────────────────────────────────────────────────
  crawler-processor-service:
    container_name: ${CRAWLER_CONTAINER_PREFIX:-auto-crawler}-processor
    build:
      context: ./processor-service
      dockerfile: Dockerfile
    pull_policy: never
    image: crawler-processor-service:latest
    restart: always
    ports:
      - "28301:8301"
    environment:
      - CRAWLER_MINIO_ACCESS_KEY=${CRAWLER_MINIO_ACCESS_KEY}
      - CRAWLER_MINIO_SECRET_KEY=${CRAWLER_MINIO_SECRET_KEY}
      - CRAWLER_PROCESSOR_SERVER_SECRET=${CRAWLER_PROCESSOR_SERVER_SECRET}
    volumes:
      - ./post-process:/app/post-process:rw
      - ./processor-service/config.yaml:/app/crawler-processor-service/config.yaml:ro
      - ./data/post-process/data:/app/post-process/data:rw
      - ./data/post-process/output:/app/post-process/output:rw
      - ./data/crawler-processor-service/cache:/app/crawler-processor-service/cache:rw
      - ./data/crawler-processor-service/processed_jobs.json:/app/crawler-processor-service/processed_jobs.json:rw
      - ./logs/crawler-processor-service:/app/crawler-processor-service/logs:rw
    networks:
      - crawler-net
  
  # ── 模拟通知接收服务（本地测试用）────────────────────────────────────────
  mock-notify-receiver:
    container_name: ${CRAWLER_CONTAINER_PREFIX:-auto-crawler}-mock-notify-receiver
    build:
      context: ./mock-notify-receiver
      dockerfile: Dockerfile
    image: mock-notify-receiver:latest
    restart: always
    ports:
      - "28401:8401"
    environment:
      - MOCK_NOTIFY_SECRET=${MOCK_NOTIFY_SECRET:-}
    volumes:
      - ./mock-notify-receiver/config.yaml:/app/config.yaml:ro
      - ./logs/mock-notify-receiver:/app/logs:rw
    networks:
      - crawler-net

networks:
  crawler-net:
    driver: bridge
