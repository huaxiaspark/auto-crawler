server:
  host: "0.0.0.0"
  port: 8301
  secret: "${CRAWLER_PROCESSOR_SERVER_SECRET}"
  jobs_file: "./processed_jobs.json"
  processing_timeout: 600

storage:
  type: "minio"
  endpoint: "http://112.126.80.142:29000"
  access_key: "${CRAWLER_MINIO_ACCESS_KEY}"
  secret_key: "${CRAWLER_MINIO_SECRET_KEY}"
  bucket: "sxpx"
  prefix: "raw/"
  secure: false
  local_cache_dir: "./cache"

processor:
  script_path: "../post-process/batch_process_data.py"
  data_dir: "../post-process/data"
  output_dir: "../post-process/output"
  cleanup_after_upload: true

upload:
  type: "minio"
  endpoint: "http://112.126.80.142:29000"
  access_key: "${CRAWLER_MINIO_ACCESS_KEY}"
  secret_key: "${CRAWLER_MINIO_SECRET_KEY}"
  bucket: "sxpx"
  prefix: "output/"
  secure: false

notify:
  platforms:
    - name: "mock-receiver-notify"
      enabled: true
      url: "http://mock-notify-receiver:8401/data/notify"
      token: ""
      retry_times: 5
      retry_interval_seconds: 15
    - name: "mock-receiver-webhook"
      enabled: false
      url: "http://mock-notify-receiver:8401/webhook"
      token: ""
      retry_times: 5
      retry_interval_seconds: 15

log_dir: "./logs"
log_max_size_mb: 5             # 单日志文件最大大小（MB），超出后立即滚动
