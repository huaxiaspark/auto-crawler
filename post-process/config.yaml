# 批量数据处理配置文件
# 修改此文件以调整处理行为，无需修改 Python 代码

# ── 全局设置 ──────────────────────────────────────────────
global:
  time_format: "%Y-%m-%d %H:%M:%S.000"   # 输出时间戳格式
  data_root: "data"                        # 数据根目录（相对于脚本所在目录）
  output_root: "output"                    # 输出根目录（相对于脚本所在目录）
  max_file_size_mb: 5                      # 单文件超过此大小（MB）时自动拆分
  log_dir: "logs"                          # 日志目录（相对于脚本所在目录）
  log_max_size_mb: 5                       # 单日志文件最大大小（MB），超出后立即滚动

# ── 文本值映射表 ───────────────────────────────────────────
# 用于将文本列转换为数值，key 为原始文本，value 为映射数值
# "其他" 为兜底值，未在映射表中的值将使用该值
value_maps:
  limit_exceed:                            # 是否越限
    否: 0
    是: 1
    其他: 2

  unit_status:                             # 开停状态
    停机: 0
    开机: 1
    其他: 2

  test_result:                             # 当日测试结果
    不合格: 0
    合格: 1
    不确定: 2
    其他: 3

  must_run_status:                         # 必开必停状态
    必停: 0
    必开: 1
    其他: 2

  must_run_reason:                         # 必开必停原因
    供热必开: 0
    临时检修必停: 1
    计划检修必停: 2
    事故停运: 3
    其他原因必停: 4
    其他: 5

# ── 二次调频时段偏移 ──────────────────────────────────────
# 时段编号 -> [小时, 分钟]，5 时段/天
secondary_freq_period_offsets:
  1: [0, 0]
  2: [4, 48]
  3: [9, 36]
  4: [14, 24]
  5: [19, 12]

# ── 数据处理任务列表 ──────────────────────────────────────
# 每个任务对应 data/ 下的一个子目录
# type 决定使用哪种处理逻辑，其余字段为该逻辑的参数
tasks:

  - name: 断面约束
    type: section_constraints
    sheet_name: "REPORT0"
    skip_rows: 2
    columns: [序号, 日期, 断面名称, 断面描述, 正向传输极限, 反向传输极限]
    output_dir: 断面约束
    outputs:
      - col: 正向传输极限
        file: 断面约束_正向传输极限
      - col: 反向传输极限
        file: 断面约束_反向传输极限
    mapping_file: 断面信息映射.csv   # 输出断面名称->描述的映射文件

  - name: 实时备用总量
    type: reserve_capacity
    skip_rows: 2
    date_col_idx: 1
    value_cols:
      - {idx: 2, name: 上旋最小值}
      - {idx: 3, name: 下旋最小值}
    output_dir: 实时备用总量
    output_file: 实时备用总量

  - name: 日前备用总量
    type: reserve_capacity
    skip_rows: 2
    date_col_idx: 1
    value_cols:
      - {idx: 2, name: 上旋最小值}
      - {idx: 3, name: 下旋最小值}
    output_dir: 日前备用总量
    output_file: 日前备用总量

  - name: 实时各时段出清现货电量
    type: clearing_quantity
    skip_rows: 3
    columns: [序号, 日期, 时点, 出清现货电量]
    output_dir: 实时各时段出清现货电量
    output_file: 实时各时段出清现货电量

  - name: 输电通道可用容量
    type: channel_numeric
    skip_rows: 2
    columns: [序号, 通道名称, 日期, 时点, 可用容量]
    name_col: 通道名称
    value_col: 可用容量
    output_dir: 输电通道可用容量
    output_file: 输电通道可用容量

  - name: 日前联络线计划
    type: channel_numeric
    skip_rows: 2
    columns: [序号, 通道, 日期, 时点, 数值]
    name_col: 通道
    value_col: 数值
    output_dir: 日前联络线计划
    output_file: 日前联络线计划

  - name: 重要通道实际输电情况
    type: channel_numeric
    skip_rows: 2
    columns: [序号, 断面名称, 日期, 时点, 数值]
    name_col: 断面名称
    value_col: 数值
    output_dir: 重要通道实际输电情况
    output_file: 重要通道实际输电情况

  - name: 断面约束情况及影子价格
    type: channel_numeric
    skip_rows: 2
    columns: [序号, 断面名称, 日期, 时点, 数值]
    name_col: 断面名称
    value_col: 数值
    output_dir: 断面约束情况及影子价格
    output_file: 断面约束情况及影子价格

  - name: 实时输电断面约束及阻塞
    type: channel_text
    skip_rows: 2
    columns: [序号, 断面名称, 日期, 时点, 是否越限]
    name_col: 断面名称
    value_col: 是否越限
    value_map: limit_exceed
    output_dir: 实时输电断面约束及阻塞
    output_file: 实时输电断面约束及阻塞
    mapping_file: 是否越限映射.csv

  - name: 实时节点边际电价
    type: node_lmp
    output_dir: 实时节点边际电价
    output_prefix: 实时节点边际电价
    lmp_columns:
      - {keyword: 电能量价格, fallback_idx: 3, suffix: 电能量价格}
      - {keyword: 阻塞价格,   fallback_idx: 4, suffix: 阻塞价格}
      - {keyword: 节点电价,   fallback_idx: 5, suffix: 节点电价}

  - name: 日前节点边际电价
    type: node_lmp
    output_dir: 日前节点边际电价
    output_prefix: 日前节点边际电价
    # 支持目录名前缀匹配（如 data/日前节点边际电价_xxx/）
    dir_prefix_match: true
    lmp_columns:
      - {keyword: 电能量价格, fallback_idx: 3, suffix: 电能量价格}
      - {keyword: 阻塞价格,   fallback_idx: 4, suffix: 阻塞价格}
      - {keyword: 节点电价,   fallback_idx: 5, suffix: 节点电价}

  - name: 抽蓄电站水位
    type: reservoir_level
    skip_rows: 2
    columns: [序号, 日期, 描述, 数值]
    name_col: 描述
    value_col: 数值
    output_dir: 抽蓄电站水位
    output_file: 抽蓄电站水位

  - name: 日前正负备用需求
    type: reserve_demand
    skip_rows: 2
    columns: [序号, 日期, 备用类型, 备用负荷]
    name_col: 备用类型
    value_col: 备用负荷
    output_dir: 日前正负备用需求
    output_file: 日前正负备用需求

  - name: 日前市场出清概况
    type: clearing_overview_excel
    skip_rows: 2
    columns: [序号, 日期, 出清概况]
    output_dir: 日前市场出清概况
    output_file: 日前市场出清概况

  - name: 实时市场出清概况
    type: clearing_overview_csv
    file_encoding: utf-8
    header_row: 1
    output_dir: 实时市场出清概况
    output_file: 实时市场出清概况

  - name: 日前机组开机安排
    type: unit_commitment
    columns: [机组名称, 日期, 时点, 开停状态]
    name_col: 机组名称
    status_col_keywords: [开停, 状态]
    value_map: unit_status
    output_dir: 日前机组开机安排
    output_file: 日前机组开机安排
    mapping_file: 开停状态映射.csv

  - name: 节点分配因子
    type: node_factor
    columns: [序号, 日期, 时段, 节点名称, 分配因子]
    name_col: 节点名称
    value_col: 分配因子
    output_dir: 节点分配因子
    output_file: 节点分配因子

  - name: 输变电设备检修计划
    type: maintenance_plan
    skip_rows: 2
    columns: [序号, 日期, 设备名称, 设备类型, 开始时间, 结束时间]
    output_dir: 输变电设备检修计划
    output_file: 输变电设备检修计划

  - name: 二次调频出清结果
    type: secondary_freq_clearing
    sheet_name: "REPORT0_C_C_C"
    date_col: 业务日期
    period_col: 时段
    output_cols:
      - timestamp
      - 时段
      - 调频需求容量
      - 调频主体边际排序价格
      - 市场出清价格（中标均价）
      - 市场供给容量
      - 市场限价
      - 最大kp值
    output_dir: 二次调频出清结果
    output_file: 二次调频出清结果

  - name: 省调煤电机组最大出力认定考核公示
    type: coal_unit_capacity
    sheet_name: "REPORT0"
    name_col: 机组名称
    date_col: 日期
    ffill_cols:
      - 机组名称
      - 装机容量（MW）
      - 月前申报最大出力（MW）
    outputs:
      - {col: 当日认定最大出力（MW）, file: 当日认定最大出力}
      - {col: 装机容量（MW）,         file: 装机容量}
      - {col: 月前申报最大出力（MW）, file: 月前申报最大出力}
      - {col: 当日测试结果_数值,      file: 当日测试结果}
    test_result_col: 当日测试结果
    value_map: test_result
    output_dir: 省调煤电机组最大出力认定考核公示
    mapping_file: 当日测试结果映射.csv

  - name: 机组实际发电曲线
    type: unit_generation_curve
    sheet_name: "REPORT0"
    name_col: 机组名称
    date_col: 日期
    exclude_cols: [序号, 日期, 机组名称]
    value_col: 发电量
    output_dir: 机组实际发电曲线
    output_file: 机组实际发电曲线

  # ── 以下为自动补齐的缺失任务 ─────────────────────────────────

  - name: 96点电网运行实际值
    type: timeseries_multicol
    skip_rows: 2
    columns: [序号, 日期, 时点, 系统负荷实际值, 外送实际值, 风电实际值, 光伏实际值, 风光总加实际值, 水电实际值, 频率实际值, 实际上旋备用, 实际下旋备用, 非市场化机组实际出力]
    value_col_names:
      - 系统负荷实际值
      - 外送实际值
      - 风电实际值
      - 光伏实际值
      - 风光总加实际值
      - 水电实际值
      - 频率实际值
      - 实际上旋备用
      - 实际下旋备用
      - 非市场化机组实际出力
    output_dir: 96点电网运行实际值
    output_file: 96点电网运行实际值

  - name: 出清电价
    type: timeseries_multicol
    skip_rows: 1
    columns: [序号, 日期, 时点, 实时出清价格, 日前出清价格]
    value_col_names:
      - 实时出清价格
      - 日前出清价格
    output_dir: 出清电价
    output_file: 出清电价

  - name: 实时市场机组电力
    type: channel_numeric
    data_dir: 实时市场机组出力及电价
    skip_rows: 2
    columns: [序号, 机组名称, 日期, 时点, 电力, 电价]
    name_col: 机组名称
    value_col: 电力
    output_dir: 实时市场机组出力及电价
    output_file: 实时市场机组电力

  - name: 实时市场机组电价
    type: channel_numeric
    data_dir: 实时市场机组出力及电价
    skip_rows: 2
    columns: [序号, 机组名称, 日期, 时点, 电力, 电价]
    name_col: 机组名称
    value_col: 电价
    output_dir: 实时市场机组出力及电价
    output_file: 实时市场机组电价

  - name: 实时联络线电力
    type: channel_numeric
    data_dir: 实时联络线出力
    skip_rows: 2
    columns: [序号, 通道, 日期, 时点, 电力]
    name_col: 通道
    value_col: 电力
    output_dir: 实时联络线出力
    output_file: 实时联络线电力

  - name: 开机不满72小时机组
    type: tabular_date
    skip_rows: 2
    columns: [序号, 日期, 机组名称]
    output_col_names: [机组名称]
    output_dir: 开机不满72小时机组
    output_file: 开机不满72小时机组

  - name: 新能源出力预测(场站申报）
    type: timeseries_multicol
    skip_rows: 2
    columns: [序号, 日期, 时点, 电力值, 风电, 光伏]
    value_col_names:
      - 电力值
      - 风电
      - 光伏
    output_dir: 新能源出力预测(场站申报）
    output_file: 新能源出力预测(场站申报）

  - name: 日前各时段出清现货电量
    type: clearing_quantity
    skip_rows: 3
    columns: [序号, 日期, 时点, 出清现货电量]
    output_dir: 日前各时段出清现货电量
    output_file: 日前各时段出清现货电量

  - name: 日前必开必停机组
    type: unit_date_mapped
    skip_rows: 2
    columns: [序号, 机组名称, 日期, 机组状态, 原因]
    date_col: 日期
    name_col: 机组名称
    mapped_outputs:
      - col: 机组状态
        value_map: must_run_status
        output_file: 日前必开必停机组_机组状态
        mapping_file: 机组状态映射.csv
      - col: 原因
        value_map: must_run_reason
        output_file: 日前必开必停机组_原因
        mapping_file: 原因映射.csv
    output_dir: 日前必开必停机组

  - name: 检修总容量
    type: timeseries_multicol
    skip_rows: 2
    columns: [序号, 日期, 时点, 检修容量]
    value_col_names:
      - 检修容量
    output_dir: 检修总容量
    output_file: 检修总容量

  - name: 水电（含抽蓄）总出力
    type: timeseries_csv
    file_encoding: utf-8
    header_row: 0
    date_col: 日期
    time_col: 时点
    value_col_names:
      - 水电实际值(MW)
    output_dir: 水电（含抽蓄）总出力
    output_file: 水电（含抽蓄）总出力

  - name: 省内负荷及联络线情况
    type: timeseries_multicol
    skip_rows: 2
    columns: [序号, 日期, 时点, 日前联络线电力值, 省内负荷预测电力值, 总加电力值]
    value_col_names:
      - 日前联络线电力值
      - 省内负荷预测电力值
      - 总加电力值
    output_dir: 省内负荷及联络线情况
    output_file: 省内负荷及联络线情况

  - name: 非市场化机组出力
    type: timeseries_multicol
    skip_rows: 2
    columns: [序号, 日期, 时点, 非市场化机组出力]
    value_col_names:
      - 非市场化机组出力
    output_dir: 非市场化机组出力
    output_file: 非市场化机组出力
