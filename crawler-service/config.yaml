schedule:
  cron: "25 7 * * *"          # 定时日增模式触发时间，标准 5 字段 cron 表达式（分 时 日 月 周）
  timezone: "Asia/Shanghai"
  date_offset_days: -68       # 目标日期相对触发日期的偏移量（-1=昨天）

crawler:
  script_path: "../crawler/main.py"
  config_path: "../crawler/config.yaml"
  data_dir: "../crawler/data"
  cleanup_after_upload: true  # 上传完成后是否清除 crawler/data/ 目录

verify:
  script_path: "../data-verify/analyze_excel.py"
  config_path: "../data-verify/config.yaml"
  loss_file: "../data-verify/loss.txt"
  max_retry_rounds: 3
  retry_interval_seconds: 30

upload:
  type: "minio"
  endpoint: "http://112.126.80.142:29000"
  access_key: "${CRAWLER_MINIO_ACCESS_KEY}"
  secret_key: "${CRAWLER_MINIO_SECRET_KEY}"
  bucket: "sxpx"
  prefix: "raw/"
  secure: false

notify:
  enabled: true
  type: "http"
  url: "http://localhost:28301/api/trigger"
  secret: "${CRAWLER_NOTIFY_SECRET}"
  retry_times: 3
  retry_interval_seconds: 30

log_dir: "./logs"
log_max_size_mb: 5             # 单日志文件最大大小（MB），超出后立即滚动
